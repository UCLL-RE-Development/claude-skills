# __BRAND__ account console theme — keycloak-theme skill STARTER
#
# This file is the keycloak-theme skill's starter, copied into the project and
# then filled in. What to fill in here: `title`, `description`, and the Home
# URL on __WEB_CLIENT_ID__ in the realm (not in this file — see "Where the brand
# links"). The look lives in resources/css/account.css. Background and
# procedure: references/account.md.
#
# The account panel a user reaches from the app's own account / profile menu.
# Same look and feel as the login theme — the project's palette, its UI face,
# its corners — so signing in and then managing your account is one continuous
# surface rather than two products.
#
# ── This is a React app, not FreeMarker ─────────────────────────────────────
# `parent=keycloak.v3` is the account console proper: a PatternFly v5 React SPA
# shipped in org.keycloak.keycloak-account-ui-*.jar, with `index.ftl` as nothing
# but a shell that hands the app a JSON environment block. So there are no
# templates to restyle here. The extension points it does offer are all used:
#
#   styles=       stylesheets appended AFTER the app's own, i.e. the retint
#   scripts=      modules loaded in <head>
#   logo/logoUrl  read straight into the environment JSON the app boots from
#   resources/content.json   the sidebar navigation (see below)
#
# `index.ftl` is deliberately NOT copied. It is generated against a specific
# account-ui build (entryScript, entryStyles, entryImports, an importmap for
# React), and a copy would go stale on the next Keycloak upgrade — the whole
# point of inheriting keycloak.v3 is that the shell stays theirs.
#
# ── resources/content.json (JSON has no comments, so the note lives here) ───
# ⚠️ It must be a FULL copy of Keycloak's own nav, because the console REPLACES
# its nav with this file rather than merging. The starter's copy is Keycloak's
# with the "applications" entry removed — a project choice; put it back if the
# project wants the Applications tab.
#
# Re-derive it from the RUNNING Keycloak, not from this starter:
#     theme/keycloak.v3/account/resources/content.json
# (inside the account-ui jar / the container), then remove what the project
# does not want. It is the one file here that can silently fall behind: a
# Keycloak upgrade that adds a tab would drop it for this theme only. Compare
# it against the running copy after every upgrade (the build can warn).
parent=keycloak.v3
import=common/keycloak

# ⚠️ REQUIRED, and the single most load-bearing line in this file.
#
# keycloak.v3 inherits `darkMode=true`, and on that setting the account-ui
# BUNDLE stamps `pf-v5-theme-dark` on <html> at runtime whenever the VISITOR'S
# OS prefers dark. Nothing in the rendered shell shows this — there is no script
# in the HTML to find and no class in the markup (the one prefers-color-scheme
# string in the page belongs to the loading splash and is a red herring) — so
# reading index.ftl will not tell you it happens. PatternFly's component-level
# dark rules do not read the global tokens at all, so that class repaints the
# masthead toolbar, the menus and the controls dark straight over this theme's
# light retint, and no amount of token work in account.css fixes it.
#
# And it only does so for SOME visitors, which is what makes it dangerous:
# tested on a light machine the console looks perfect.
#
# Measured on 26.6.1 in a browser reporting `prefers-color-scheme: dark`:
# with the property inherited, `html.pf-v5-theme-dark` and a near-black
# (rgb 3,3,3) toolbar beside the coloured brand bar; with `darkMode=false`, no
# class and the toolbar on the page ground.
#
# The theme has one light cut and no switch, so the answer is to turn the whole
# mechanism off rather than to fight it selectively. js/shell.js also strips the
# class if it ever appears — a backstop, verified separately, for the day a
# release stops honouring this property.
darkMode=false

# Loaded after the app's bundle, so a plain `:root` declaration here outranks
# PatternFly's own token defaults. That is what lets one stylesheet retint the
# console.
#
# This theme is LIGHT, which makes the job smaller than a dark retint would be:
# PatternFly v5's own default cut is light, so only the tokens move and no
# `pf-v5-theme-dark` class is involved anywhere.
styles=css/account.css

# One correction that has to run in the page, because index.ftl is not ours to
# edit: the brand's link target (plus the dark-class backstop). See the file.
scripts=js/shell.js

# ── Brand ───────────────────────────────────────────────────────────────────
# `logo` is a path joined onto the theme's resourceUrl and rendered as
# `<img class="...">` inside `<a class="pf-v5-c-masthead__brand">`.
#
# ⚠️ It sits on the MASTHEAD (--p-masthead in account.css), not on a light card
# like the login theme's logo. The same cut very often does not read on both:
# check the mark against --p-masthead and use a different-colour cut here if
# it dissolves into the bar. One decision in two files.
#
# Prefer the FULL lock-up, with the product name drawn into the SVG as vector
# paths. An <img> is a sandboxed context no external font can reach, so a
# wordmark that has to be TYPED cannot be in the brand face from inside the
# image — drawn as paths, it cannot go wrong. Point `logo` at a lettering-free
# mark and the wordmark has to come back as CSS; account.css has the
# commented-out `::after` block for it.
logo=img/logo.svg

# The mark is also the favicon, as SVG. One file rather than a raster ladder,
# and one fewer thing to regenerate when the mark changes.
# ⚠️ The stock theme asks for `favicon.ico`; a theme that does not ship one
# 404s on every page load. Never reinstate a favicon.ico line unless the file
# actually exists in resources/img/.
favIcon=/img/logo.svg
favIconType=image/svg+xml

title=Account · __BRAND__
description=Manage your __BRAND__ account: your details, your password and your active sessions.

# ── Where the brand links ───────────────────────────────────────────────────
# Deliberately NOT set. `logoUrl` can only hold a static absolute URL, which
# would mean hardcoding this deployment's address in the theme — and Keycloak
# already knows it.
#
# `js/shell.js` sets the brand's href from `referrerUrl` in the console's
# environment block instead. Keycloak fills that in from the **Home URL** of
# whichever client appears in `?referrer=<clientId>`, and keycloak-js's own
# `createAccountUrl()` — which the app should call for its Profile / Account
# link — appends that parameter. So the link is driven by realm configuration,
# in one place, that Keycloak validates: a `referrer_uri` not matching the
# client's registered redirect URIs is dropped.
#
#   → Set the Home URL on `__WEB_CLIENT_ID__`
#     (Clients → __WEB_CLIENT_ID__ → Settings → Home URL).
#
# Setting `logoUrl` here still works and would override nothing — shell.js only
# replaces the href when a referrer is present — so it remains available as a
# static fallback if you ever want the brand to lead somewhere fixed for people
# who open the console directly.
# logoUrl=https://example.invalid/
