# __THEME__ login theme — STARTER from the keycloak-theme skill
#
# This file is the skill's starter, copied into the project and then filled in.
# What to fill in here: nothing but the colour-mode decision below (and, if the
# logo carries no lettering of its own, `x-brand-wordmark`). Everything else is
# structural and should stay exactly as it is. The lessons behind every line are
# in `references/login.md` of the keycloak-theme skill — read that before
# changing anything marked ⚠️.
#
# Style: the project's own surface, token for token — the project's token file
# for colour and type, the source design for how a card, a field and a button
# are actually built. The login is the door to the product for everyone, so it
# wears what the product already showed them.
#
# `parent=base` so every page this theme does not draw (OTP, password reset,
# WebAuthn, error, …) still renders from Keycloak's own templates. `styles.css`
# is written against the literal class names pinned below, which is what makes
# a single stylesheet enough to cover all of them.
#
# `import=common/keycloak` supplies js/passwordVisibility.js and js/authChecker.js,
# both of which template.ftl loads.
parent=base
import=common/keycloak

# ── Colour mode ─────────────────────────────────────────────────────────────
# DEFAULT: a single LIGHT cut. Choose by matching the app the visitor came from:
#
#   * light-only app  → darkMode=false, x-kte-color-mode=light  (this default)
#   * dark-only app   → darkMode=false, x-kte-color-mode=dark, AND the :root
#                       block in styles.css must be the DARK cut of the palette
#                       (plus `color-scheme: dark` on html.kcHtmlClass)
#   * app that follows the OS preference → x-kte-color-mode=system, darkMode=true,
#                       and styles.css needs a dark :root under the dark class
#
# ⚠️ Never follow the OS preference unless the app itself does. A login page that
# went dark because the visitor's OS is in dark mode would not match the page
# they arrived from.
#
# `x-kte-color-mode=light` makes template.ftl emit
# `<meta name="color-scheme" content="light">` and skip both the dark class and
# the prefers-color-scheme script, which has nothing left to decide.
darkMode=false
x-kte-color-mode=light

# ── Brand lock-up ───────────────────────────────────────────────────────────
# false: img/logo.svg already carries the product's name as vector lettering,
#        so template.ftl renders ONLY the image, with brandName as its alt text.
# true:  img/logo.svg is a bare mark; template.ftl renders it (decorative) plus
#        a typed wordmark `${msg("brandName")}` in the heading font, styled by
#        `.kcBrandWordmark` in styles.css.
# Why it matters: an <img> is a sandboxed context no webfont reaches, so
# lettering inside an SVG that is still <text> renders in whatever face the
# client picked. Either the lettering is outlined to paths in the SVG (false),
# or it is typed in HTML where the theme's @font-face applies (true).
x-brand-wordmark=false

styles=css/styles.css

# No `scripts=`. The theme needs no JavaScript of its own: everything it draws
# is CSS, and the two modules the pages do load (passwordVisibility.js,
# authChecker.js) come from `import=common/keycloak` via template.ftl.
#
# ⚠️ If one is ever added, note that `scripts=` is emitted as a CLASSIC script
# in <head>, so it runs before the form is parsed — guard on DOMContentLoaded
# rather than switching to type="module", which only 26.7's `themeResources`
# model can express.

