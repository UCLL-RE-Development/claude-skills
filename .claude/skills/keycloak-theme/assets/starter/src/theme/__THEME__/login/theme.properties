# ── Properties the BASE templates need that theme editors omit ──────────────
# Theme editors build their list for the keycloak.v2 templates. This theme
# declares `parent=base`, so the pages OTHER than the ones it draws itself come
# from base/login/*.ftl — and those reference these seventeen properties too.
# Left undeclared they expand to the empty string, so the element renders
# `class=""` and nothing styles it: reset-password, OTP entry, TOTP setup,
# update-password, update-profile, register, terms, WebAuthn, recovery codes,
# device-verify and x509 all lose their form layout that way.
# Verified against every .ftl in base/login from Keycloak 26.0.2 onward.
kcButtonDefaultClass=kcButtonDefaultClass
kcCheckInputClass=kcCheckInputClass
kcFormButtonsClass=kcFormButtonsClass
kcFormButtonsWrapperClass=kcFormButtonsWrapperClass
kcFormOptionsClass=kcFormOptionsClass
kcInputClassRadioCheckboxLabelDisabled=kcInputClassRadioCheckboxLabelDisabled
kcInputHelperTextAfterClass=kcInputHelperTextAfterClass
kcInputHelperTextBeforeClass=kcInputHelperTextBeforeClass
kcInputWrapperClass=kcInputWrapperClass
kcLoginOTPListInputClass=kcLoginOTPListInputClass
kcRecoveryCodesActions=kcRecoveryCodesActions
kcRecoveryCodesList=kcRecoveryCodesList
kcSelectAuthListItemArrowClass=kcSelectAuthListItemArrowClass
kcSelectAuthListItemIconPropertyClass=kcSelectAuthListItemIconPropertyClass
kcSelectAuthListItemTitle=kcSelectAuthListItemTitle
kcTextareaClass=kcTextareaClass
kcWebAuthnKeyIcon=kcWebAuthnKeyIcon

# ── Radio / checkbox option classes ─────────────────────────────────────────
# Used by `user-profile-commons.ftl` for user-profile attributes whose
# `inputType` annotation is select-radiobuttons or multiselect-checkboxes, on
# register, update-profile, idp-review-profile and update-email.
#
# ⚠️ These are easy to miss because the template launders them through local
# variables — `<#assign classDiv=properties.kcInputClassRadio!>` and then
# `class="${classDiv}"` — so a scan looking for `${properties.…}` inside a class
# attribute cannot see them. Present on every version from 26.0.2 to 26.7.1; a
# coverage audit has to follow the indirection (see references/login.md).
kcInputClassCheckbox=kcInputClassCheckbox
kcInputClassCheckboxInput=kcInputClassCheckboxInput
kcInputClassCheckboxLabel=kcInputClassCheckboxLabel
kcInputClassRadio=kcInputClassRadio
kcInputClassRadioInput=kcInputClassRadioInput
kcInputClassRadioLabel=kcInputClassRadioLabel
