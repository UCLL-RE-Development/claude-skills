# __BRAND__ admin console theme (FULL RESTYLE) — keycloak-theme skill STARTER
#
# This file is the keycloak-theme skill's starter, copied into the project and
# then filled in. What to fill in here: `title` / `description` only. The look
# lives in resources/css/admin.css (the same --p-* palette as the account
# console), the optional realm gate in resources/js/admin.js.
# Background, both admin modes and every trap: references/admin.md.
#
# Build this type ONLY when the user asked for the admin console to be styled
# too. The admin console is Keycloak's tool, not the product's surface; the
# default is no admin type at all, and the lighter option is "brand only"
# (references/admin.md). This starter is the full restyle.
#
# ── Where the admin theme comes from ─────────────────────────────────────────
# ⚠️ Keycloak resolves the admin theme from the realm you SIGN IN to — almost
# always `master` — never from the realm picked in the console's realm list.
# So `adminTheme=__THEME__` has to be set on master, and once it is, EVERY
# realm administered from master wears it. js/admin.js has an off-by-default
# gate that limits the look to named realms.
# ⚠️ The console's own sign-in page is master's LOGIN theme, not this one. A
# full restyle therefore also means master's loginTheme (tell the user; it is
# their realm configuration).
#
# ── This is a React app, not FreeMarker ─────────────────────────────────────
# keycloak.v2/admin is a PatternFly v5 React SPA (org.keycloak.keycloak-admin-
# ui-*.jar) with index.ftl as a shell. Do NOT copy index.ftl: it is generated
# against one admin-ui build and goes stale on the next upgrade. The extension
# points used: styles=, scripts=, logo, favIcon, title, description, darkMode.
parent=keycloak.v2

# Stock keycloak.v2/admin declares no `import`; the shell's React importmap
# uses ${resourceCommonUrl} either way. Declared for parity with the account
# type — verified harmless on 26.6.1 (the vendor/react files still 200).
import=common/keycloak

# ⚠️ REQUIRED. keycloak.v2/admin sets `darkMode=true`, and with it index.ftl
# emits an inline <script> that adds `pf-v5-theme-dark` to <html> whenever the
# VISITOR'S OS prefers dark, plus `<meta name="color-scheme" content="light
# dark">`. Unlike the account console (where the BUNDLE stamps the class), here
# it is the shell — so `darkMode=false` removes the script outright and the
# meta becomes `light`. Measured on 26.6.1 with prefers-color-scheme: dark:
# inherited → html.pf-v5-theme-dark and a near-black console under this
# palette's light tokens; darkMode=false → no class.
# ⚠️ There is a SECOND source the property does not reach: Realm settings →
# Themes (the built-in quick-theme editor) adds the class itself from the OS
# preference unless the realm attribute darkMode is "false". js/admin.js strips
# it, which is why the script is not optional.
darkMode=false

# Loaded after the console's own CSS (index.ftl lists entryStyles, then these),
# and PatternFly declares its tokens on `:where(:root)` (zero specificity), so a
# plain `:root` here wins.
styles=css/admin.css

# The dark-class backstop and the optional realm gate. A module, in <head>.
scripts=js/admin.js

# ⚠️ LEADING SLASH, keep it. The masthead joins resourceUrl and this value with
# a slash-normalising helper, but the realm DASHBOARD does
# `resourceUrl + logo` with no separator: `img/logo.svg` becomes
# `…/admin/__THEME__img/logo.svg`, which does not 404 — it falls through theme
# inheritance to keycloak.v2's own file, so the masthead is branded and the
# dashboard still shows Keycloak. `/img/logo.svg` works in both places.
# ⚠️ The mark sits on --p-masthead (masthead) AND on a light card (dashboard):
# pick a cut that reads on both, or accept the dashboard trade-off.
logo=/img/logo.svg

# Also concatenated with no separator (`${resourceUrl}${favIcon}`), so it also
# needs the slash. Stock asks for /favicon.svg; do not point this at a file you
# do not ship.
favIcon=/img/logo.svg
favIconType=image/svg+xml

title=__BRAND__ · Administration
description=Administration console for __BRAND__.

# logoUrl: leave unset. The brand then links to the current realm's dashboard,
# which is what an administrator expects; a static URL would take them out of
# the console.
