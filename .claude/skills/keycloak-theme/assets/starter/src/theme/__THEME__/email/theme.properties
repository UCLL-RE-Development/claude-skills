# __BRAND__ email theme
#
# The mails Keycloak sends: verify address, reset password, "your password was
# changed", failed-login alerts, identity-provider links, org invites, and the
# test mail from Realm settings → Email.
#
# `parent=base` gives us all of them (eighteen at the time of writing). Each one
# is a single line — `${kcSanitize(msg("passwordResetBodyHtml", …))?no_esc}` —
# wrapped in `html/template.ftl`'s `emailLayout` macro, so overriding that ONE
# file brands every mail, present and future, without copying any of them.
#
# base also supplies the matching plain-text alternatives under `text/`. Those
# are left alone: a text/plain part with markup in it is worse than a plain one.
#
# `messages/` carries exactly one key of ours, for the footer line. See the file.
parent=base

# ── Images in the mail ──────────────────────────────────────────────────────
# EMPTY BY DEFAULT, AND IT SHOULD STAY EMPTY.
#
# ONE absolute, public base URL for every image these mails reference, or empty.
#
# Empty (the default) → html/template.ftl draws the brand as TYPE: a text
# wordmark with an accent rule under it. Nothing to block, no requests, identical
# in every client, and the theme stays SELF-CONTAINED — everything it renders
# comes out of the jar.
#
# ⚠️ SETTING THIS BREAKS THE SELF-CONTAINED RULE. It makes every mail depend on
# a server outside the theme, so do it only with the project owner's explicit
# OK, and record the deviation. Why there is no self-contained way to put an
# image in a mail:
#
#   - data: URI images are blocked by Gmail and Outlook.
#   - Inline <svg> is stripped outright by both, and neither renders
#     image/svg+xml in <img> either — so an image here has to be a PNG.
#   - A theme resource is no good either. A mail is read outside the server's
#     session, days later, so an image has to be fetched over the public
#     internet from a URL that is still there. Keycloak serves theme resources
#     under a path containing a build-specific version segment
#     (/resources/<ver>/...), which changes on upgrade and would rot every mail
#     already in an inbox.
#
# So an image can only come from some OTHER host with stable URLs (typically the
# product's own app), whose address would then be hardcoded here — the one
# place in the theme that would name it.
#
# ⚠️ Even when set, it is a PROGRESSIVE ENHANCEMENT on top of the type
# wordmark, never a replacement: most clients block remote images by DEFAULT,
# and Outlook rewrites what it does load. template.ftl keeps the text wordmark
# as the <img>'s alt text and the rule under it either way.
#
# If it is ever set, template.ftl expects `brand.png` under it. Verify with:
#   curl -s -o /dev/null -w "%{http_code}" <assetBaseUrl>/brand.png
# ── Logo in the mail, served by Keycloak itself (preferred) ─────────────────
# A PNG inside THIS theme (email/resources/img/), e.g. x-mail-logo=img/logo.png.
# html/template.ftl loads it from url.resourcesUrl: Keycloak's own public URL
# for this theme's files. Self-contained (it ships in the jar); empty = the
# type-only wordmark. PNG at 2x the 132px display width, transparent.
x-mail-logo=

assetBaseUrl=
# Set to true TOGETHER with assetBaseUrl, and only with the project owner's OK.
# It records the decision in the theme; the self-contained check then warns
# instead of failing, and requires the source PNGs in email/resources/img/.
# See references/self-contained.md in the keycloak-theme skill.
x-mail-images-hosted=false
