# __BRAND__ email theme — message overrides, English.
#
# One key, used by html/template.ftl's footer. Everything else in every mail is
# Keycloak's own copy, which `parent=base` supplies.
#
# ⚠️ Keycloak loads ONLY `messages_<locale>.properties`; a suffix-less
# `messages.properties` here is read by nothing. If the realm offers other
# locales, add a messages_<locale>.properties per locale carrying this key, so
# the footer is in the same language as the body above it.
#
# {0} is the realm's display name — Realm settings → Display name. Set it to the
# product's name rather than leaving it as the realm id, because this line is
# what tells a recipient the mail is genuine.
themeEmailFooter=Sent by {0}. If you did not expect this message you can ignore it — nothing changes unless you follow the link above.

# The wordmark at the top of every mail. The PRODUCT's name, deliberately not
# the realm's: realm ids and display names are configuration and often differ
# from the brand (SKILL.md Step 3). The footer above still names the realm.
themeEmailBrand=__BRAND__
