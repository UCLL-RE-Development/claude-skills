# __THEME__ login theme — message overrides, English. STARTER from the
# keycloak-theme skill.
#
# What to fill in: `brandName` (the product's display name), and the footer
# keys only if the project has an imprint / privacy page. For another locale,
# copy this file to messages_<locale>.properties and translate the labels.
# Lessons: `references/login.md` in the keycloak-theme skill.
#
# Anything not listed here falls through to Keycloak's own messages, so this
# file stays short on purpose.
#
# ⚠️ Keycloak loads ONLY `messages_<locale>.properties` — there is no
# suffix-less fallback file. Overrides put in a plain `messages.properties` are
# read by nothing and fail silently: the page then renders the literal key —
# `brandName` as the image's alt text, `<a href="imprintUrl">imprintLabel</a>`
# in the footer.
#
# ⚠️ Which bundle is used depends on the realm, not on the theme: with
# Internationalization disabled Keycloak serves `en` to everybody. If the app is
# not English-first, enable Internationalization on the realm and set its
# default locale to match the app.
#
# ⚠️ APOSTROPHES MUST BE DOUBLED — `don''t`, not `don't`. Keycloak runs every
# message through java.text.MessageFormat, where a single quote is the ESCAPE
# character and is swallowed: "don't" renders as "dont". Nothing warns you; it
# reads like a typo in the source. Grep `^[^#].*'` over this file before
# shipping copy.

# ── Brand lock-up (template.ftl) ────────────────────────────────────────────
# With x-brand-wordmark=false: the accessible name of the brand image only —
# the name is drawn INTO the artwork as paths, so this string is never
# displayed. With x-brand-wordmark=true: the visible wordmark beside the mark.
# It is not the realm's display name, which is infrastructure naming rather
# than a product name, and it is normally not translated: it is a product name.
brandName=__BRAND__
#
# There is deliberately no tagline key. The eyebrow under the lock-up is
# Keycloak's own page title ("Sign in to your account", "Forgot your password?",
# …), so it reads correctly on all thirty-odd pages this theme covers instead of
# on the one a mockup would show.

# ── Footer links (footer.ftl) ───────────────────────────────────────────────
# Empty = the link is not rendered (footer.ftl checks ?has_content). Keep the
# keys even when empty — a MISSING key renders as its own name.
imprintUrl=
dataProtectionUrl=
imprintLabel=Imprint
dataProtectionLabel=Privacy

# The banner slot template.ftl reserves above the form. Empty = hidden.
infoMessage=
